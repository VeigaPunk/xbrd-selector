[package]
name = "ufo-cli"
version = "0.1.0"
edition = "2021"
description = "UFO local rover CLI (pure Rust, local mailbox) - accepts and runs operations on the host."
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/VeigaPunk/ufogrokbd"

[[bin]]
name = "ufo"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive", "env"] }
tokio = { version = "=1.36.0", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "signal", "fs", "sync"] }
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
anyhow = "=1.0.80"
chrono = { version = "=0.4.34", default-features = false, features = ["clock", "std", "serde"] }
dirs = "=5.0.1"
uuid = { version = "=1.7.0", features = ["v4", "serde"] }
fs2 = "=0.4.3"
reqwest = { version = "=0.12.12", default-features = false, features = ["json", "rustls-tls"] }
ufo-auth = { path = "../ufo-auth" }
